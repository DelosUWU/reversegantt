
lint:code:
  extends: .python_job
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
  stage: lint

  script:
    - echo "Running code linting..."


    - pip install ruff pytest pytest-cov


    - echo "Running ruff check..."
    - ruff check app/ --output-format=text || true


    - echo "Running ruff format check..."
    - ruff format --check app/ || true


    - mkdir -p reports
    - ruff check app/ --output-format=json > reports/lint.json || true
    - ruff check app/ --output-format=text > reports/lint.txt || true

  artifacts:
    paths:
      - reports/lint.json
      - reports/lint.txt
    expire_in: 7 days


  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.py"
        - "requirements.txt"
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - "**/*.py"
        - "requirements.txt"


test:unit:
  extends: .python_job
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
  stage: test

  variables:

    DATABASE_URL: "postgresql://test:test@postgres:5432/testdb"

  services:

    - postgres:15-alpine
      alias: postgres

  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust

  script:
    - echo "Running unit tests..."


    - pip install pytest pytest-cov pytest-asyncio httpx


    - mkdir -p reports


    - |
      pytest tests/ \
        --cov=app \
        --cov-report=xml:reports/coverage.xml \
        --cov-report=html:reports/coverage-html \
        --cov-report=term \
        --junit-xml=reports/junit.xml \
        -v || exit_code=$?


    - echo "Test execution completed"
    - |
      if [ -f reports/coverage.xml ]; then
        echo "Coverage report generated"
      fi

  artifacts:
    paths:
      - reports/junit.xml
      - reports/coverage.xml
      - reports/coverage-html/
    reports:
      junit: reports/junit.xml
      cobertura: reports/coverage.xml
    expire_in: 30 days


  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.py"
        - "tests/**/*"
        - "requirements.txt"


validate:structure:
  extends: .python_job
  stage: validate

  script:
    - echo "Validating project structure..."
    - |
      # Проверяем наличие важных файлов
      test -f requirements.txt || (echo "requirements.txt not found!" && exit 1)
      test -f Dockerfile || (echo "Dockerfile not found!" && exit 1)
      test -d app || (echo "app directory not found!" && exit 1)
      echo "Project structure is valid!"

  only:
    - branches
    - merge_requests